name: "Setup ndk"
description: "Sets up Android NDK r29"
outputs:
  ndk-path:
    value: ${{ steps.path.outputs.path }}
    description: "Output path of the ndk"
  cache-hit:
    value: ${{ steps.cache.outputs.cache-hit }}
    description: "Whether a cache hit occurred for the ndk"
runs:
  using: "composite"
  steps:
    - name: NDK cache
      id: cache
      uses: actions/cache@v3
      with:
        path: ${HOME}/android-ndk-r29/
        key: ${{ runner.os }}-ndk-r29

    - name: Download ndk
      if: ${{ !steps.cache.outputs.cache-hit }}
      env:
        NDK_URL: https://dl.google.com/android/repository/android-ndk-r29-linux.zip
      run: wget ${NDK_URL} -O ${HOME}/ndk.zip
      shell: bash

    - name: Unzip ndk
      if: ${{ !steps.cache.outputs.cache-hit }}
      run: unzip -q "${HOME}/ndk.zip" -d "${HOME}/"
      shell: bash

    - name: Set output
      id: path
      shell: bash
      run: echo "path=${HOME}/android-ndk-r29" >> ${GITHUB_OUTPUT}
